<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskflow — Ergin Lab</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#0b0e17;color:#f3f5ff;font:16px/1.5 system-ui,sans-serif}.app{width:min(680px,100%)}a{color:#b9f27c;text-decoration:none}.tag{font-size:.75rem;letter-spacing:.15em;color:#b9f27c;font-weight:800}h1{font-size:clamp(2.6rem,8vw,4rem);letter-spacing:-.07em;margin:12px 0 4px}.sub{color:#a1abc4;margin:0 0 24px}.panel{padding:clamp(18px,4vw,30px);background:#151a29;border:1px solid #2a3147;border-radius:22px}form{display:flex;gap:9px}input,button{font:inherit;padding:12px 14px;border-radius:11px;border:1px solid #343d56}input{min-width:0;flex:1;background:#0d1220;color:#f3f5ff}button{cursor:pointer;background:#b9f27c;color:#182016;font-weight:800}.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 10px;color:#a1abc4;font-size:.88rem}.filters{display:flex;gap:5px}.filters button{background:#20263a;color:#cbd2e8;border-color:#343d56;padding:7px 10px;font-size:.8rem}.filters button.active{background:#aaa0ff;color:#17152a;border-color:#aaa0ff}.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #2a3147}.task:last-child{border:0}.task input{flex:0 0 auto;accent-color:#b9f27c;width:18px;height:18px}.task span{flex:1;overflow-wrap:anywhere}.task.done span{text-decoration:line-through;color:#78839e}.del{background:transparent;color:#ff9ca8;border:0;padding:6px}.empty{text-align:center;color:#8c97b3;padding:24px 0}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}.bottom small{color:#8c97b3}.bottom button{background:transparent;color:#a1abc4}.back{display:inline-block;margin-bottom:24px}
</style></head><body><main class="app"><a class="back" href="../index.html">← Ergin Lab</a><div class="tag">EXPERIMENT 001 / STORAGE</div><h1>Taskflow.</h1><p class="sub">Görevlerini küçük adımlara böl.</p><section class="panel"><form id="form"><input id="entry" maxlength="160" placeholder="Yeni bir görev yaz…" required aria-label="Yeni görev"><button>+ Ekle</button></form><div class="meta"><span id="summary">0 aktif görev</span><div class="filters"><button type="button" class="active" data-filter="all">Tümü</button><button type="button" data-filter="open">Aktif</button><button type="button" data-filter="done">Biten</button></div></div><ul id="list" style="list-style:none;padding:0;margin:0"></ul><div id="empty" class="empty">İlk görevini ekleyerek başla.</div><div class="bottom"><small>Kaydedilenler bu tarayıcıda tutulur.</small><button type="button" id="clear">Bitenleri temizle</button></div></section></main><script>
const KEY='ergin-lab-taskflow';let tasks=[];try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{tasks=[]}let filter='all';const list=document.querySelector('#list'),empty=document.querySelector('#empty');function persist(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}function render(){list.replaceChildren();const shown=tasks.filter(t=>filter==='all'||(filter==='open'&&!t.done)||(filter==='done'&&t.done));empty.hidden=shown.length>0;empty.textContent=tasks.length?'Bu görünümde görev yok.':'İlk görevini ekleyerek başla.';document.querySelector('#summary').textContent=`${tasks.filter(t=>!t.done).length} aktif / ${tasks.length} toplam`;for(const t of shown){const li=document.createElement('li');li.className='task'+(t.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.setAttribute('aria-label','Tamamlandı');cb.addEventListener('change',()=>{t.done=cb.checked;persist()});const text=document.createElement('span');text.textContent=t.text;const del=document.createElement('button');del.className='del';del.textContent='Sil';del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);persist()});li.append(cb,text,del);list.append(li)}}document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const input=document.querySelector('#entry'),text=input.value.trim();if(!text)return;tasks.unshift({id:Date.now()+Math.random(),text,done:false});input.value='';persist()});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}));document.querySelector('#clear').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);persist()});render();
</script></body></html>
