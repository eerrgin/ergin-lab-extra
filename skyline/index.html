<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skyline — Ergin Lab</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#0c1424,#203b56);color:#f3f7ff;font:16px/1.5 system-ui,sans-serif}.app{width:min(650px,100%)}a{color:#a8f0d7;text-decoration:none}.tag{font-size:.75rem;letter-spacing:.15em;color:#a8f0d7;font-weight:800;margin-top:24px}h1{font-size:clamp(2.8rem,8vw,4.5rem);letter-spacing:-.07em;line-height:1;margin:12px 0}.sub{color:#b4c4d9}.panel{padding:clamp(18px,4vw,30px);border:1px solid #ffffff28;background:#ffffff0c;border-radius:24px;margin-top:24px}form{display:flex;gap:9px;margin-bottom:12px}input,button{font:inherit;padding:12px 14px;border-radius:11px;border:1px solid #ffffff30}input{min-width:0;flex:1;background:#08132699;color:white}button{cursor:pointer;background:#a8f0d7;color:#10252a;font-weight:800}.status{color:#c2d0e1;min-height:25px}.weather{display:none;margin-top:25px}.weather.show{display:block}.place{color:#b7c9df}.temp{font-size:clamp(4rem,14vw,6rem);font-weight:750;letter-spacing:-.08em;line-height:1.1}.desc{text-transform:capitalize}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.chip{background:#ffffff10;border-radius:10px;padding:10px 12px}.help{color:#9db1c9;font-size:.83rem;margin-top:20px}@media(max-width:480px){form{flex-direction:column}}
</style></head><body><main class="app"><a href="../index.html">← Ergin Lab</a><div class="tag">EXPERIMENT 003 / API</div><h1>Skyline.</h1><p class="sub">Şehir ara. Güncel hava durumunu API üzerinden getir.</p><section class="panel"><form id="search"><input id="city" value="Istanbul" placeholder="Şehir adı" required aria-label="Şehir adı"><button>Veriyi getir ↗</button></form><div class="status" id="status" role="status">Başlamak için bir şehir ara.</div><div class="weather" id="weather"><div class="place" id="place"></div><div class="temp" id="temp">--°</div><div class="desc" id="desc"></div><div class="chips"><div class="chip" id="feels"></div><div class="chip" id="humidity"></div><div class="chip" id="wind"></div></div></div><form id="keyForm" style="margin-top:20px"><input id="key" placeholder="OpenWeather API anahtarı" autocomplete="off" aria-label="API anahtarı"><button>Anahtarı kullan</button></form><div class="help">API anahtarı olmadan istek gönderilmez. Anahtar yalnızca bu sekmenin sessionStorage alanında tutulur; kaynak koduna eklenmez. Ücretsiz anahtar: openweathermap.org/api</div></section></main><script>
const key=document.querySelector('#key'),statusEl=document.querySelector('#status'),weather=document.querySelector('#weather');key.value=sessionStorage.getItem('skyline-key')||'';document.querySelector('#keyForm').addEventListener('submit',e=>{e.preventDefault();if(key.value.trim())sessionStorage.setItem('skyline-key',key.value.trim());else sessionStorage.removeItem('skyline-key');statusEl.textContent='Anahtar bu sekme için güncellendi.'});document.querySelector('#search').addEventListener('submit',async e=>{e.preventDefault();const city=document.querySelector('#city').value.trim(),apiKey=key.value.trim()||sessionStorage.getItem('skyline-key');if(!apiKey){statusEl.textContent='Önce OpenWeather API anahtarını gir.';weather.classList.remove('show');return}statusEl.textContent='Veri isteniyor…';weather.classList.remove('show');try{const url=`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${encodeURIComponent(apiKey)}&units=metric&lang=tr`;const res=await fetch(url),data=await res.json();if(!res.ok)throw Error(res.status===404?'Şehir bulunamadı.':res.status===401?'API anahtarı geçersiz veya henüz etkinleşmedi.':`İstek başarısız: ${res.status}`);document.querySelector('#place').textContent=`${data.name}, ${data.sys.country}`;document.querySelector('#temp').textContent=`${Math.round(data.main.temp)}°C`;document.querySelector('#desc').textContent=data.weather?.[0]?.description||'Hava bilgisi yok';document.querySelector('#feels').textContent=`Hissedilen ${Math.round(data.main.feels_like)}°C`;document.querySelector('#humidity').textContent=`Nem %${data.main.humidity}`;document.querySelector('#wind').textContent=`Rüzgâr ${Math.round(data.wind.speed*3.6)} km/sa`;weather.classList.add('show');statusEl.textContent='Güncel veri alındı.'}catch(err){statusEl.textContent=err.message==='Failed to fetch'?'Bağlantı kurulamadı. İnternetini kontrol et.':err.message}});
</script></body></html>
