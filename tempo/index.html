<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tempo — Ergin Lab</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#10131e;color:#f3f5ff;font:16px/1.5 system-ui,sans-serif}.app{width:min(590px,100%);text-align:center}a{color:#b9f27c;text-decoration:none;display:block;text-align:left}.tag{font-size:.75rem;letter-spacing:.15em;color:#b9f27c;font-weight:800;margin-top:25px}h1{font-size:clamp(2.8rem,8vw,4.5rem);letter-spacing:-.07em;margin:10px 0 0}.sub{color:#a1abc4}.timer{margin-top:26px;padding:clamp(22px,5vw,38px) 14px;border:1px solid #30394f;border-radius:24px;background:linear-gradient(145deg,#1b2132,#141925)}.time{font-size:clamp(3rem,12vw,5.8rem);font-variant-numeric:tabular-nums;font-weight:750;letter-spacing:-.07em;white-space:nowrap}.centi{font-size:.5em;color:#aaa0ff}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:20px}.controls button{padding:12px 16px;border:1px solid #39435b;border-radius:11px;background:#293247;color:#f3f5ff;font:700 1rem system-ui;cursor:pointer}.controls .primary{background:#b9f27c;color:#182016;border-color:#b9f27c}.laps{max-width:330px;margin:22px auto 0;text-align:left}.laps h2{font-size:.85rem;color:#a1abc4}.lap{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #30394f;font-variant-numeric:tabular-nums}.empty{color:#7e8aa8;text-align:center;font-size:.9rem;padding:10px}
</style></head><body><main class="app"><a href="../index.html">← Ergin Lab</a><div class="tag">EXPERIMENT 004 / TIME</div><h1>Tempo.</h1><p class="sub">Zamanı ölç. Tur al. Yeniden dene.</p><section class="timer"><div class="time"><span id="clock">00:00</span><span class="centi" id="centi">.00</span></div><div class="controls"><button id="toggle" class="primary">▶ Başlat</button><button id="lapBtn">◷ Tur kaydet</button><button id="reset">↺ Sıfırla</button></div><div class="laps"><h2>TURLAR <span id="count">(0)</span></h2><div id="laps" class="empty">Henüz tur kaydedilmedi.</div></div></section></main><script>
let running=false,elapsed=0,startAt=0,timer=null,laps=[];const toggle=document.querySelector('#toggle');function format(ms){const cs=Math.floor(ms/10),seconds=Math.floor(cs/100)%60,minutes=Math.floor(cs/6000),centis=cs%100;return {clock:`${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`,centi:String(centis).padStart(2,'0')}}function paint(){const f=format(elapsed+(running?performance.now()-startAt:0));document.querySelector('#clock').textContent=f.clock;document.querySelector('#centi').textContent='.'+f.centi}function drawLaps(){const box=document.querySelector('#laps');document.querySelector('#count').textContent=`(${laps.length})`;box.replaceChildren();if(!laps.length){box.className='empty';box.textContent='Henüz tur kaydedilmedi.';return}box.className='';laps.forEach((value,i)=>{const row=document.createElement('div');row.className='lap';const name=document.createElement('span');name.textContent=`Tur ${laps.length-i}`;const time=document.createElement('strong'),f=format(value);time.textContent=f.clock+'.'+f.centi;row.append(name,time);box.append(row)})}toggle.addEventListener('click',()=>{if(running){elapsed+=performance.now()-startAt;running=false;clearInterval(timer);timer=null;toggle.textContent='▶ Devam et'}else{startAt=performance.now();running=true;timer=setInterval(paint,25);toggle.textContent='Ⅱ Duraklat'}paint()});document.querySelector('#lapBtn').addEventListener('click',()=>{if(elapsed===0&&!running)return;laps.unshift(elapsed+(running?performance.now()-startAt:0));drawLaps()});document.querySelector('#reset').addEventListener('click',()=>{running=false;clearInterval(timer);timer=null;elapsed=0;startAt=0;laps=[];toggle.textContent='▶ Başlat';paint();drawLaps()});paint();
</script></body></html>
