<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calc Lab — Ergin Lab</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#10131e;color:#f3f5ff;font:16px/1.5 system-ui,sans-serif}.app{width:min(390px,100%)}a{color:#b9f27c;text-decoration:none}.tag{font-size:.75rem;letter-spacing:.15em;color:#b9f27c;font-weight:800}h1{font-size:2.6rem;letter-spacing:-.06em;margin:10px 0 0}.sub{color:#a1abc4;margin:0 0 20px}.calc{padding:16px;background:#171d2b;border:1px solid #30394f;border-radius:24px}.screen{min-height:105px;display:flex;flex-direction:column;justify-content:end;align-items:end;padding:12px;overflow:hidden}.prev{color:#8f9bb7;min-height:25px}.now{font-size:3rem;font-weight:700;letter-spacing:-.06em;max-width:100%;overflow-wrap:anywhere}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys button{min-height:58px;border:0;border-radius:13px;background:#293247;color:#f3f5ff;font:600 1.1rem system-ui;cursor:pointer}.keys .util{background:#3a4358}.keys .op{background:#34305b;color:#c4bcff}.keys .eq{background:#b9f27c;color:#172015}.keys .zero{grid-column:span 2}.note{font-size:.8rem;color:#7e8aa8;text-align:center;margin-top:15px}
</style></head><body><main class="app"><a href="../index.html">← Ergin Lab</a><p class="tag" style="margin-top:22px">EXPERIMENT 002 / INPUT</p><h1>Calc Lab.</h1><p class="sub">Fare veya klavyeyle hesapla.</p><section class="calc"><div class="screen" aria-live="polite"><div class="prev" id="prev"></div><div class="now" id="now">0</div></div><div class="keys" id="keys"><button class="util" data-act="clear">AC</button><button class="util" data-act="sign">±</button><button class="util" data-act="percent">%</button><button class="op" data-op="/">÷</button><button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button><button class="op" data-op="*">×</button><button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button><button class="op" data-op="-">−</button><button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button><button class="op" data-op="+">+</button><button class="zero" data-num="0">0</button><button data-act="dot">.</button><button class="eq" data-act="equals">=</button></div></section><div class="note">Keyboard: 0–9 · + − * / · Enter · Escape</div></main><script>
let display='0',stored=null,op=null,waiting=false;const now=document.querySelector('#now'),prev=document.querySelector('#prev');function paint(){now.textContent=display;prev.textContent=stored!==null?`${stored} ${({'+':'+','-':'−','*':'×','/':'÷'})[op]||''}`:''}function number(n){if(waiting){display=n;waiting=false}else if(display==='0')display=n;else if(display.length<16)display+=n;paint()}function choose(o){if(stored!==null&&!waiting)solve();stored=Number(display);op=o;waiting=true;paint()}function solve(){if(stored===null||!op)return;const a=stored,b=Number(display);let r;if(op==='+')r=a+b;if(op==='-')r=a-b;if(op==='*')r=a*b;if(op==='/')r=b===0?null:a/b;display=r===null?'Sıfıra bölünemez':Number.isFinite(r)?String(Number(r.toPrecision(12))):'Hata';stored=null;op=null;waiting=true;paint()}function action(a){if(a==='clear'){display='0';stored=null;op=null;waiting=false}else if(a==='sign'&&!isNaN(Number(display)))display=String(-Number(display));else if(a==='percent'&&!isNaN(Number(display)))display=String(Number(display)/100);else if(a==='dot'&&!display.includes('.'))display+='.';else if(a==='equals')solve();paint()}document.querySelector('#keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.num!==undefined)number(b.dataset.num);else if(b.dataset.op)choose(b.dataset.op);else action(b.dataset.act)});document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))number(e.key);else if(['+','-','*','/'].includes(e.key))choose(e.key);else if(e.key==='.')action('dot');else if(e.key==='Enter'||e.key==='=')action('equals');else if(e.key==='Escape')action('clear')});
</script></body></html>
